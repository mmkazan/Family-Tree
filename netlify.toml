[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Nice URL for the API (also set via the function's own `config.path`)
[[redirects]]
  from = "/api/tree"
  to = "/.netlify/functions/tree"
  status = 200

# Always fetch the freshest page + script so a redeploy shows up immediately
[[headers]]
  for = "/index.html"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"
