<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Elaia — memories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
  :root{color-scheme:light;--bg:#e9ebe4;--surface:#f8f8f3;--surface-2:#f1f2ea;--ink:#17262b;--muted:#5d6b6f;--faint:#8a9599;
    --accent:#1e5c6e;--accent-deep:#17495a;--olive:#6f9b6e;--olive-soft:#e3ece0;--hair:#d7d8cd;--danger:#a5453a;--gold:#8a754a;
    --shadow:0 1px 2px rgba(23,38,43,.08),0 6px 18px rgba(23,38,43,.09);--radius:11px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
  .wrap{max-width:640px;margin:0 auto;padding:44px 22px 80px}
  .serif{font-family:"GFS Didot",Georgia,serif;font-weight:400}
  header.top{text-align:center;margin-bottom:26px}
  .name{font-family:"GFS Didot",Georgia,serif;font-size:2.1rem;letter-spacing:.5px}
  .tagline{color:var(--muted);margin:.4em 0 0;font-size:1rem}
  .card{background:var(--surface);border:1px solid var(--hair);border-left:4px solid var(--olive);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 18px 16px;margin-bottom:16px}
  .for{font-family:"GFS Didot",serif;font-size:1.2rem}
  .meta{color:var(--muted);font-size:.86rem;margin-top:2px}
  .txt{margin:12px 0 6px;font-size:1.02rem}
  .med{margin:10px 0 4px}
  .med audio,.med video,.med img{width:100%;max-width:420px;border-radius:8px;display:block;margin:8px 0}
  .row{display:flex;gap:10px;margin-top:12px;align-items:center}
  .btn{border:1px solid var(--accent);border-radius:8px;padding:8px 16px;font:inherit;font-weight:600;font-size:.92rem;cursor:pointer;background:var(--accent);color:#fff}
  .btn:hover{background:var(--accent-deep)}
  .btn.ghost{background:transparent;color:var(--muted);border-color:var(--hair)}
  .btn.ghost:hover{border-color:var(--danger);color:var(--danger)}
  .btn.small{padding:5px 12px;font-size:.82rem}
  .btn.saved{background:var(--olive);border-color:var(--olive);color:#fff}
  .trbox{margin:12px 0 4px;padding:11px 12px;background:var(--surface-2);border:1px solid var(--hair);border-radius:9px}
  .trhint{font-size:.78rem;color:var(--faint);margin-bottom:8px}
  .trl{display:block;margin-bottom:8px}
  .trlang{display:block;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--olive);margin-bottom:3px}
  .trtext{width:100%;font:inherit;font-size:.95rem;line-height:1.45;color:var(--ink);background:var(--surface);border:1px solid var(--hair);border-radius:7px;padding:8px 10px;resize:vertical}
  .trtext:focus{outline:none;border-color:var(--accent)}
  .trrow{display:flex;gap:8px;margin-top:2px}
  .fromrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 10px}
  .fromlbl{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--muted)}
  .fromsel{font:inherit;font-size:.9rem;color:var(--ink);background:var(--surface);border:1px solid var(--hair);border-radius:7px;padding:5px 8px;max-width:220px}
  .fromsel:focus{outline:none;border-color:var(--accent)}
  .fromsaved{font-size:.78rem;color:var(--muted)}.fromsaved.good{color:var(--olive)}.fromsaved.bad{color:var(--danger)}
  .trlang{display:flex;align-items:center;gap:6px}
  .sayb{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;padding:0;border:1px solid var(--hair);border-radius:50%;
    background:var(--surface);color:var(--olive);cursor:pointer;transition:.15s}
  .sayb:hover{border-color:var(--olive);background:var(--olive-soft)}
  .sayb svg{width:12px;height:12px}
  .sayb.saying{background:var(--olive);color:#fff;border-color:var(--olive)}
  .pill{font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;font-weight:700;color:var(--gold);margin-left:auto}
  .pill.ok{color:var(--olive)}
  .grp-head{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--hair)}
  .grp-head:first-child{margin-top:0}
  .grp-name{font-size:1.35rem}
  .grp-role{font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--accent-deep);background:var(--surface-2);border:1px solid var(--hair);border-radius:20px;padding:2px 8px}
  .grp-count{margin-left:auto;font-size:.8rem;color:var(--gold);font-weight:700}
  .grp-count.done{color:var(--olive)}
  .empty{text-align:center;color:var(--muted);padding:30px 8px;border:1px dashed var(--faint);border-radius:10px}
  .msg{min-height:1.2em;color:var(--muted);font-size:.9rem;text-align:center}
  .foot{text-align:center;color:var(--faint);font-size:.8rem;margin-top:26px}
  a{color:var(--accent-deep)}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid var(--hair);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="name serif">Memories</div>
    <p class="tagline">Voice notes, photos and messages the family sent in. Keep the ones to show on the tree — you and the tree’s editors can approve.</p>
  </header>
  <div id="view"><div class="msg"><span class="spin"></span> Loading…</div></div>
  <p class="foot"><a href="/my">← back to your trees</a></p>
</div>
<script>
(function(){
  "use strict";
  var view=document.getElementById("view");
  function esc(s){return (s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function api(p,o){o=o||{};o.credentials="include";return fetch(p,o);}
  function when(ts){ try{return new Date(ts).toLocaleDateString();}catch(e){return "";} }
  // ?tree=… may be the real tree id OR a readable family-name slug (e.g. "kazantzis-family").
  // We match either, so the URL can read nicely while actions still use the real id.
  function slugify(s){ return (s||"").toString().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,""); }
  function scopeMatches(m){
    if(!onlyTree) return true;
    var k=onlyTree.toLowerCase();
    return m.tree===onlyTree || slugify(m.treeTitle)===k;
  }
  // When the page is scoped to a single tree (via ?tree=… from "Review memories", or because you
  // moderate just one tree), show THAT family's name as the heading, so it's clearly their page and
  // not a generic shared one. With several trees and no scope, keep "Memories" and the per-tree headers.
  function brandHeader(list){
    var titles={}; (list||[]).forEach(function(m){ if(m.treeTitle) titles[m.tree]=m.treeTitle; });
    var ids=Object.keys(titles);
    var title = (ids.length===1) ? titles[ids[0]] : "";   // list is already filtered to scope before this runs
    var nameEl=document.querySelector("header.top .name"), tagEl=document.querySelector("header.top .tagline");
    if(title && nameEl){
      nameEl.textContent=title;
      if(tagEl) tagEl.textContent="Voice notes, photos and messages your family sent in — approve the ones to keep on the tree.";
      try{ document.title=title+" — memories"; }catch(e){}
    }
  }

  api("/api/me").then(function(r){ if(r.status!==200){ location.href="/my"; return null; } return load(); });

  function param(n){ try{ return new URLSearchParams(location.search).get(n)||""; }catch(e){ return ""; } }
  var onlyTree=param("tree");
  var peopleByTree={}, _ttsAudio=null;
  var SPEAKER='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 010 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';

  function load(){
    return api("/api/memories").then(function(r){return r.json();}).then(function(d){
      var list=(d&&d.memories)||[];
      peopleByTree=(d&&d.peopleByTree)||{};
      if(onlyTree) list=list.filter(scopeMatches);
      brandHeader(list);   // when this is one tree's page, show that family's name so it isn't a generic "Memories"
      if(!list.length){ view.innerHTML='<div class="empty">No memories to review yet. When family send a voice note, photo or message to the WhatsApp number for someone on the tree, they’ll appear here.</div>'; return; }
      // group by tree, pending first within each
      var groups={}, order=[];
      list.forEach(function(m){ if(!groups[m.tree]){ groups[m.tree]=[]; order.push(m.tree); } groups[m.tree].push(m); });
      var html=order.map(function(tid){
        var items=groups[tid].slice().sort(function(a,b){ return (a.status==="approved")-(b.status==="approved") || b.ts-a.ts; });
        var t0=items[0]||{};
        var pending=items.filter(function(m){return m.status!=="approved";}).length;
        var head = (order.length>1 || onlyTree)
          ? '<div class="grp-head"><span class="grp-name serif">'+esc(t0.treeTitle||"Family tree")+'</span>'+
            (t0.yourRole==="editor"?'<span class="grp-role">you’re an editor</span>':'')+
            (pending?'<span class="grp-count">'+pending+' to review</span>':'<span class="grp-count done">all reviewed</span>')+'</div>'
          : '';
        return head + items.map(card).join("");
      }).join("");
      view.innerHTML=html;
      view.querySelectorAll("[data-act]").forEach(function(b){ b.addEventListener("click",function(){ act(b); }); });
      view.querySelectorAll(".fromsel").forEach(function(s){ s.addEventListener("change",function(){ setFrom(s); }); });
      view.querySelectorAll(".sayb").forEach(function(b){ b.addEventListener("click",function(){ playTts(b); }); });
      autoEnhance(list);   // auto-translate anything missing a translation, and warm the voices in the background
    }).catch(function(){ view.innerHTML='<div class="empty">Couldn’t load — refresh to try again.</div>'; });
  }
  // Background enhancement: (1) pre-generate + cache the read-aloud voice for every memory that
  // already has a translation, so the ▶ plays instantly; (2) auto-transcribe+translate any memory
  // that has content but no translation yet, so the reviewer sees both languages without clicking.
  var _ttsWarmed={}, _autoTried={};
  function warmMem(m){
    var tr=m.tr; if(!tr||!tr.texts) return;
    Object.keys(tr.texts).forEach(function(k){
      if(!tr.texts[k]) return;
      var url="/api/tts?tree="+encodeURIComponent(m.tree)+"&mem="+encodeURIComponent(m.id)+"&lang="+encodeURIComponent(k)+"&v=3";
      if(_ttsWarmed[url]) return; _ttsWarmed[url]=1;
      try{ fetch(url,{credentials:"same-origin"}).then(function(r){ if(!r.ok) delete _ttsWarmed[url]; }).catch(function(){ delete _ttsWarmed[url]; }); }
      catch(e){ delete _ttsWarmed[url]; }
    });
  }
  function needsTr(m){
    if(m.tr && m.tr.texts && Object.keys(m.tr.texts).length) return false;   // already translated
    if(_autoTried[m.tree+"/"+m.id]) return false;                            // tried once — don't loop on failures
    var hasAudio=(m.media||[]).some(function(x){ return /^audio\//.test(x.type); });
    return !!(m.text || hasAudio);                                           // something translatable
  }
  function autoEnhance(list){
    list.forEach(function(m){ if(m.tr && m.tr.texts) warmMem(m); });   // instant: warm what's ready now
    var todo=list.filter(needsTr);
    if(!todo.length) return;
    todo.forEach(function(m){ _autoTried[m.tree+"/"+m.id]=1; });
    view.querySelectorAll('[data-act="translate"]').forEach(function(b){
      var id=b.getAttribute("data-mem");
      if(todo.some(function(m){ return m.id===id; })){ b.disabled=true; b.textContent="Translating…"; }
    });
    mToast(todo.length===1?"Translating a new memory…":("Translating "+todo.length+" new memories…"));
    (function next(i){
      if(i>=todo.length){ load(); return; }   // re-render once at the end; warmMem then runs for the fresh translations
      var m=todo[i];
      api("/api/memories",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({tree:m.tree,mem:m.id,action:"translate"})})
        .then(function(r){return r.json();}).catch(function(){return null;})
        .then(function(){ next(i+1); });
    })(0);
  }

  function media(m){
    if(/^audio\//.test(m.type)) return '<audio controls preload="none" src="'+m.url+'"></audio>';
    if(/^video\//.test(m.type)) return '<video controls preload="none" src="'+m.url+'"></video>';
    if(/^image\//.test(m.type)) return '<img loading="lazy" src="'+m.url+'" alt="photo" />';
    return '<a href="'+m.url+'">attachment</a>';
  }
  var LNAME={el:"Greek",en:"English",es:"Spanish",fr:"French",it:"Italian",de:"German",pt:"Portuguese",pl:"Polish",tr:"Turkish",ru:"Russian",uk:"Ukrainian",ar:"Arabic",he:"Hebrew",zh:"Chinese",hi:"Hindi"};
  // Editable transcript + translation (Gemini). Owner/editor can fix a garbled auto-transcript.
  function trBlock(m){
    var tr=m.tr, langs = (tr&&tr.texts)?Object.keys(tr.texts):[];
    var rows = langs.map(function(k){
      return '<label class="trl"><span class="trlang">'+esc(LNAME[k]||k.toUpperCase())+
        '<button type="button" class="sayb" data-tree="'+esc(m.tree)+'" data-mem="'+esc(m.id)+'" data-lang="'+esc(k)+'" title="Read aloud (also warms it for the tree)" aria-label="Read aloud">'+SPEAKER+'</button></span>'+
        '<textarea class="trtext" data-lang="'+esc(k)+'" rows="2">'+esc(tr.texts[k]||"")+'</textarea></label>';
    }).join("");
    var has=langs.length>0;
    var btns='<div class="trrow">'+
      (has?'<button class="btn small" data-act="savetr" data-tree="'+esc(m.tree)+'" data-mem="'+esc(m.id)+'">Save</button>':'')+
      '<button class="btn ghost small" data-act="translate" data-tree="'+esc(m.tree)+'" data-mem="'+esc(m.id)+'">'+(has?'Re-translate':'Transcribe &amp; translate')+'</button></div>';
    return '<div class="trbox" data-src="'+esc((tr&&tr.sourceLang)||"")+'">'+
      '<div class="trhint">'+(has?'Transcript &amp; translation — edit if anything’s off, then Save.':'Transcribe &amp; translate into both languages.')+'</div>'+
      rows+btns+'</div>';
  }
  // "From" dropdown — assign the WhatsApp sender to a tree person (once). After that,
  // messages from that number auto-map, so you never assign the same person again.
  function fromBlock(m){
    var people=peopleByTree[m.tree]||[];
    var placeholder=m.fromName||"WhatsApp sender";
    var opts='<option value="">— not linked ('+esc(placeholder)+') —</option>'+
      people.map(function(p){ return '<option value="'+esc(p.id)+'"'+(p.id===m.fromPersonId?' selected':'')+'>'+esc(p.name)+'</option>'; }).join("");
    return '<div class="fromrow"><span class="fromlbl">From</span>'+
      '<select class="fromsel" data-tree="'+esc(m.tree)+'" data-mem="'+esc(m.id)+'">'+opts+'</select>'+
      '<span class="fromsaved" id="fs_'+esc(m.id)+'"></span></div>';
  }
  function setFrom(sel){
    var tree=sel.getAttribute("data-tree"), mem=sel.getAttribute("data-mem"), pid=sel.value;
    var note=document.getElementById("fs_"+mem); if(note){ note.textContent="Saving…"; note.className="fromsaved"; }
    api("/api/memories",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({tree:tree,mem:mem,action:"setfrom",fromPersonId:pid})})
      .then(function(r){return r.json();}).then(function(j){
        if(j&&j.ok){ if(note){ note.textContent=pid?"✓ saved — future messages auto-link":"unlinked"; note.className="fromsaved good"; } }
        else if(note){ note.textContent="couldn’t save"; note.className="fromsaved bad"; }
      }).catch(function(){ if(note){ note.textContent="couldn’t save"; note.className="fromsaved bad"; } });
  }
  var _ttsObjUrl=null;
  function mToast(msg){
    var t=document.getElementById("mToast");
    if(!t){ t=document.createElement("div"); t.id="mToast";
      t.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9999;opacity:0;transition:opacity .2s;max-width:88vw;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.25)";
      document.body.appendChild(t); }
    t.textContent=msg; t.style.opacity="1";
    clearTimeout(t._h); t._h=setTimeout(function(){ t.style.opacity="0"; },2800);
  }
  function playTts(b){
    var url="/api/tts?tree="+encodeURIComponent(b.getAttribute("data-tree"))+"&mem="+encodeURIComponent(b.getAttribute("data-mem"))+"&lang="+encodeURIComponent(b.getAttribute("data-lang"))+"&v=3";
    if(_ttsAudio){ try{_ttsAudio.pause();}catch(e){} }
    if(_ttsObjUrl){ try{ URL.revokeObjectURL(_ttsObjUrl); }catch(e){} _ttsObjUrl=null; }
    b.classList.add("saying");
    var busy=function(){ b.classList.remove("saying"); mToast("Read-aloud is busy right now — please try again in a minute."); };
    var done=function(){ b.classList.remove("saying"); };
    // Fetch first so a real "voice is busy" (quota / 503) is told apart from a normal end.
    fetch(url,{credentials:"same-origin"}).then(function(r){
      if(!r.ok){ busy(); return null; }
      return r.blob();
    }).then(function(bl){
      if(!bl) return;
      var o=URL.createObjectURL(bl); _ttsObjUrl=o;
      _ttsAudio=new Audio(o); _ttsAudio.onended=done; _ttsAudio.onerror=done; _ttsAudio.play().catch(done);
    }).catch(busy);
  }
  function card(m){
    var pill = m.status==="approved" ? '<span class="pill ok">on the tree</span>' : '<span class="pill">to review</span>';
    var meds=(m.media||[]).map(function(x){return '<div class="med">'+media(x)+'</div>';}).join("");
    var actions = m.status==="approved" ? '' :
      '<div class="row"><button class="btn" data-act="approve" data-tree="'+esc(m.tree)+'" data-mem="'+esc(m.id)+'">Keep on the tree</button>'+
      '<button class="btn ghost" data-act="reject" data-tree="'+esc(m.tree)+'" data-mem="'+esc(m.id)+'">Hide</button></div>';
    return '<div class="card"><div style="display:flex;align-items:baseline"><span class="for serif">For '+esc(m.personName)+'</span>'+pill+'</div>'+
      '<div class="meta">'+when(m.ts)+'</div>'+fromBlock(m)+
      (m.text?'<div class="txt">“'+esc(m.text)+'”</div>':'')+meds+trBlock(m)+actions+'</div>';
  }
  function act(b){
    var tree=b.getAttribute("data-tree"), mem=b.getAttribute("data-mem"), action=b.getAttribute("data-act");
    var payload={tree:tree,mem:mem,action:action};
    if(action==="savetr"){ var box=b.closest(".trbox"), texts={};
      if(box) box.querySelectorAll(".trtext").forEach(function(t){ texts[t.getAttribute("data-lang")]=t.value; });
      payload.tr={sourceLang:(box&&box.getAttribute("data-src"))||"", texts:texts}; }
    var oldTxt=b.textContent; b.disabled=true; if(action==="translate")b.textContent="Working…"; if(action==="savetr")b.textContent="Saving…";
    api("/api/memories",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)})
      .then(function(r){return r.json();}).then(function(j){
        if(j && j.ok===false){ alert(j.configured===false ? "Translation isn’t switched on yet — add the Gemini key in Netlify." : "Couldn’t translate — try again."); b.disabled=false; b.textContent=oldTxt; return; }
        if(action==="savetr"){ b.textContent="Saved ✓"; b.classList.add("saved"); setTimeout(function(){ b.textContent=oldTxt; b.classList.remove("saved"); b.disabled=false; },1600); return; }  // confirm in place, no jarring reload
        load();
      }).catch(function(){ alert("Couldn’t update — try again."); b.disabled=false; b.textContent=oldTxt; });
  }
})();
</script>
</body>
</html>
