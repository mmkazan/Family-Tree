<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<title>Kazantzis Family Tree</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css" crossorigin="" />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="" />
<style>
  :root{
    --bg:#e9ebe4; --stage:#eef0e9; --surface:#f8f8f3; --surface-2:#f1f2ea;
    --ink:#17262b; --muted:#5d6b6f; --faint:#8a9599;
    --accent:#1e5c6e; --accent-soft:#dbe6e6; --brass:#b4894a; --brass-soft:#e6d6b8; --olive:#6f9b6e; --olive-soft:#e3ece0;
    --line:#b7a98a; --hair:#d7d8cd; --danger:#a5453a;
    --born:#1e5c6e; --raised:#6f9b6e; --educated:#b4894a; --worked:#4a6f9e; --lived:#9e6b8a; --died:#7d746b; --other:#8a9599;
    --baptism:#6f93b8; --military:#7a7150; --immigration:#4f9e86; --married:#b0688e; --burial:#6d7076;
    --sex-m:#4f7fa8; --sex-m-bg:#eef4f9; --sex-f:#b06f92; --sex-f-bg:#f8eef3;
    --shadow:0 1px 2px rgba(23,38,43,.08),0 6px 18px rgba(23,38,43,.09);
    --shadow-lg:0 12px 40px rgba(23,38,43,.22);
    --radius:11px; --card-w:210px;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --bg:#0f1a1d; --stage:#12201f; --surface:#182a2d; --surface-2:#14252a;
    --ink:#e9e7dd; --muted:#a6b3b3; --faint:#6f807f;
    --accent:#5aa7ba; --accent-soft:#1c333a; --brass:#d0a45e; --brass-soft:#3a3120; --olive:#8bb46a; --olive-soft:#20302a;
    --line:#8a7a54; --hair:#26383b; --danger:#d98a80;
    --born:#5aa7ba; --raised:#8bb46a; --educated:#d0a45e; --worked:#6f97c9; --lived:#c08bab; --died:#9a9086; --other:#7f908f;
    --baptism:#7fa6cc; --military:#a99a6e; --immigration:#66b39a; --married:#c98aab; --burial:#8b8e94;
    --sex-m:#6f97c9; --sex-m-bg:#17252f; --sex-f:#c98aab; --sex-f-bg:#271b23;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    --shadow-lg:0 16px 44px rgba(0,0,0,.6);
  }}
  :root[data-theme="dark"]{
    --bg:#0f1a1d; --stage:#12201f; --surface:#182a2d; --surface-2:#14252a;
    --ink:#e9e7dd; --muted:#a6b3b3; --faint:#6f807f;
    --accent:#5aa7ba; --accent-soft:#1c333a; --brass:#d0a45e; --brass-soft:#3a3120; --olive:#8bb46a; --olive-soft:#20302a;
    --line:#8a7a54; --hair:#26383b; --danger:#d98a80;
    --born:#5aa7ba; --raised:#8bb46a; --educated:#d0a45e; --worked:#6f97c9; --lived:#c08bab; --died:#9a9086; --other:#7f908f;
    --baptism:#7fa6cc; --military:#a99a6e; --immigration:#66b39a; --married:#c98aab; --burial:#8b8e94;
    --sex-m:#6f97c9; --sex-m-bg:#17252f; --sex-f:#c98aab; --sex-f-bg:#271b23;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    --shadow-lg:0 16px 44px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;}
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh}

  header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--surface);
    border-bottom:1px solid var(--hair);box-shadow:var(--shadow);z-index:600;position:relative;}
  .crest{width:34px;height:34px;flex:0 0 auto;color:var(--brass)}
  .titles{min-width:0}
  .fam{font-family:"GFS Didot",Georgia,"Times New Roman",serif;font-size:26px;line-height:1;letter-spacing:.3px;
    color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fam .alt{color:var(--muted);font-size:19px;margin-left:8px}
  .sub{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:4px}
  .spacer{flex:1}
  .toolbar{display:flex;align-items:center;gap:8px}

  .seg{display:inline-flex;border:1px solid var(--hair);border-radius:999px;overflow:hidden;background:var(--surface-2)}
  .seg button{border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:700;
    letter-spacing:.03em;padding:7px 13px;cursor:pointer;transition:background .15s,color .15s;display:inline-flex;align-items:center;gap:6px}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
  :root[data-theme="dark"] .seg button[aria-pressed="true"],
  :root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#08161a}
  .seg button svg{width:15px;height:15px}

  .btn{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:13.5px;font-weight:500;
    border:1px solid var(--hair);background:var(--surface-2);color:var(--ink);padding:8px 13px;border-radius:9px;cursor:pointer;
    transition:background .15s,border-color .15s,transform .05s;}
  .btn:hover{background:var(--accent-soft);border-color:var(--accent)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  :root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:#08161a}
  .btn .ic{width:16px;height:16px;flex:0 0 auto}
  .icon-btn{width:38px;height:38px;padding:0;justify-content:center;border-radius:9px}
  .btn[disabled]{opacity:.5;cursor:default}
  body:not(.editmode) .edit-only{display:none !important}

  /* Stage / tree */
  .stagewrap{position:relative;flex:1;min-height:0}
  .viewport{position:absolute;inset:0;overflow:hidden;
    background:radial-gradient(circle at 1px 1px, var(--hair) 1px, transparent 0) 0 0/26px 26px, var(--stage);
    cursor:grab;touch-action:none;}
  .viewport.grabbing{cursor:grabbing}
  #stage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  #wires{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
  /* connector colours via CSS (var() in SVG attributes is not cross-browser) */
  #wires .w-pc{stroke:var(--line);stroke-width:1.9;fill:none}
  #wires .w-partner{stroke:var(--brass);stroke-width:2.4;stroke-linecap:round;fill:none}
  #wires .w-dot{fill:var(--brass)}
  #wires .w-guard{stroke:var(--lived);stroke-width:1.8;stroke-dasharray:2 6;stroke-linecap:round;fill:none}
  #wires .w-temp{stroke:var(--accent);stroke-width:2.2;stroke-dasharray:5 4;stroke-linecap:round;fill:none}
  #wires .w-hit{stroke:transparent;stroke-width:18;fill:none;pointer-events:none}
  body.editmode #wires .w-hit{pointer-events:stroke;cursor:pointer}
  body.mapview .viewport{display:none}
  #map{position:absolute;inset:0;display:none;background:var(--stage);z-index:1}
  body.mapview #map{display:block}

  /* ===== Tapestry view ===== */
  body.tapestryview .viewport{display:none}
  body.tapestryview .zoom{display:none}
  body.tapestryview .status-pill{display:none}
  #tapestry{position:absolute;inset:0;display:none;overflow:hidden;z-index:1;
    background:#2a2620;cursor:grab;touch-action:none}
  body.tapestryview #tapestry{display:block}
  #tapestry.grabbing{cursor:grabbing}
  #tapCanvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #tapCanvas svg{display:block}
  .tapbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--hair);border-radius:999px;box-shadow:var(--shadow-lg);padding:7px 9px}
  .tapbar .tapbrand{color:var(--brass);display:flex;align-items:center;padding:0 2px 0 4px}
  .tapbar .tapbrand svg{width:18px;height:18px}
  .tapbar .tapbtns{display:flex;gap:5px;padding-right:4px;border-right:1px solid var(--hair)}
  .tapbar .tapbtns .icon-btn{background:var(--surface-2);box-shadow:none}
  .tapexport{position:relative}
  #tapExportMenu{top:auto;bottom:52px;right:0;left:auto;width:230px}
  .taphint{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:16;max-width:min(92%,560px);
    background:var(--surface);border:1px solid var(--brass);color:var(--muted);border-radius:12px;padding:9px 15px;
    font-size:13px;line-height:1.45;box-shadow:var(--shadow);text-align:center}
  body.editmode.tapestryview .taphint{display:block}
  body:not(.editmode) .taphint{display:none}

  @media print{
    body *{visibility:hidden !important}
    #tapestry,#tapestry *{visibility:visible !important}
    #tapestry{position:absolute !important;inset:0 !important;background:#fff !important;overflow:visible !important}
    #tapCanvas{position:static !important;transform:none !important}
    #tapCanvas svg{width:100% !important;height:auto !important}
    .tapbar,.taphint{display:none !important}
  }
  :root[data-theme="dark"] .leaflet-tile,
  :root:not([data-theme="light"]) .leaflet-tile{ @media (prefers-color-scheme:dark){ filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9); } }
  :root[data-theme="dark"] .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}

  .viewport,.card{user-select:none;-webkit-user-select:none;-moz-user-select:none}
  .card{position:absolute;width:var(--card-w);background:var(--surface);border:1px solid var(--hair);
    border-radius:var(--radius);padding:11px 13px 10px;box-shadow:var(--shadow);cursor:pointer;
    transition:border-color .15s,box-shadow .15s;}
  .card.sex-m{background:var(--sex-m-bg)}
  .card.sex-f{background:var(--sex-f-bg)}
  .card.sex-m::before,.card.sex-f::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:var(--radius) 0 0 var(--radius)}
  .card.sex-m::before{background:var(--sex-m)}
  .card.sex-f::before{background:var(--sex-f)}
  .card:hover{border-color:var(--accent);box-shadow:var(--shadow-lg)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),var(--shadow)}
  body.editmode .card{cursor:grab}
  body.editmode .card:active{cursor:grabbing}
  .card.dragging{cursor:grabbing;z-index:20;box-shadow:var(--shadow-lg)}
  body.linking{cursor:crosshair}
  body.linking .card{cursor:crosshair}
  .link-handle{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;
    background:var(--accent);border:2px solid var(--surface);box-shadow:var(--shadow);cursor:crosshair;opacity:0;transition:opacity .12s;touch-action:none;z-index:6}
  .card:hover .link-handle, .card:focus-within .link-handle{opacity:1}
  .link-handle::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:var(--surface);transform:translate(-50%,-50%)}
  @media (hover:none){ .link-handle{opacity:.9} }
  .link-menu{position:fixed;z-index:920;background:var(--surface);border:1px solid var(--hair);border-radius:12px;box-shadow:var(--shadow-lg);padding:8px;min-width:230px;max-width:300px}
  .link-menu .lm-head{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:6px 8px 8px}
  .link-menu .lm-opt{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font-family:inherit;font-size:14px;padding:10px 10px;border-radius:8px;cursor:pointer}
  .link-menu .lm-opt:hover{background:var(--accent-soft)}
  .link-menu .lm-cancel{display:block;width:100%;text-align:center;border:0;border-top:1px solid var(--hair);margin-top:6px;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;padding:9px;cursor:pointer}
  .link-menu .lm-opt.danger{color:var(--danger)}
  .link-menu .lm-opt.danger:hover{background:color-mix(in srgb,var(--danger) 12%,transparent)}
  .fam-now{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
  .fam-row{display:flex;align-items:baseline;gap:8px;font-size:13px}
  .fam-row .fk{flex:0 0 66px;color:var(--faint);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding-top:4px}
  .fam-row .fv{display:flex;flex-wrap:wrap;gap:6px;flex:1}
  .fam-row .fv .none{color:var(--faint)}
  .rel-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--hair);border-radius:999px;padding:4px 6px 4px 11px;font-size:12.5px;color:var(--ink)}
  .rel-chip .rx{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:12px;line-height:1;padding:2px 3px;border-radius:50%}
  .rel-chip .rx:hover{color:var(--danger)}
  .field select.sel{width:100%;font-family:inherit;font-size:14.5px;color:var(--ink);background:var(--surface-2);border:1px solid var(--hair);border-radius:8px;padding:9px 11px}
  .field select.sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  /* header popovers (search + data menu) */
  .pop{position:absolute;top:60px;right:18px;z-index:650;background:var(--surface);border:1px solid var(--hair);
    border-radius:12px;box-shadow:var(--shadow-lg);padding:10px;width:280px;display:none}
  .pop.open{display:block}
  #searchInput{width:100%;font-family:inherit;font-size:14.5px;padding:9px 11px;border-radius:8px;border:1px solid var(--hair);background:var(--surface-2);color:var(--ink)}
  #searchInput:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .pop-res{margin-top:6px;max-height:320px;overflow-y:auto;display:flex;flex-direction:column}
  .pop-res button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:0;background:transparent;
    color:var(--ink);font-family:inherit;font-size:14px;padding:8px 9px;border-radius:8px;cursor:pointer}
  .pop-res button:hover{background:var(--accent-soft)}
  .pop-res button .sub{font-size:12px;color:var(--faint)}
  .pop-res .empty{color:var(--faint);font-size:13px;padding:8px 9px}
  .pop.menu{padding:6px}
  .menu-item{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);
    font-family:inherit;font-size:14px;padding:10px 11px;border-radius:8px;cursor:pointer}
  .menu-item:hover{background:var(--accent-soft)}
  .card.flash{animation:cardflash 1.3s ease}
  @keyframes cardflash{0%,100%{box-shadow:var(--shadow)}30%,60%{box-shadow:0 0 0 3px var(--accent),0 0 22px 4px var(--accent-soft)}}
  .card .status{position:absolute;top:11px;right:12px;font-size:12px;line-height:1;color:var(--faint)}
  .card .status.live{width:7px;height:7px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
  .chead{display:flex;gap:10px;align-items:flex-start;padding-right:14px}
  .avatar{width:42px;height:42px;flex:0 0 auto;border-radius:50%;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;font-family:"GFS Didot",Georgia,serif;font-size:19px;line-height:1;
    background-size:cover;background-position:center;overflow:hidden;border:1px solid var(--hair);}
  .avatar.dec{filter:grayscale(.3) contrast(.96)}
  .cmeta{min-width:0;flex:1}
  .nm{overflow:hidden}
  .nm.primary{font-size:15px;font-weight:700;line-height:1.18;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .nm.primary.empty{font-weight:400;font-style:italic;color:var(--muted)}
  .nm.secondary{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cfoot{display:flex;align-items:center;gap:8px;margin-top:9px}
  .yrs{font-size:12px;color:var(--faint);flex:1;font-variant-numeric:tabular-nums;letter-spacing:.01em;display:flex;align-items:center;gap:5px}
  .yrs .dag{color:var(--line)}
  .chips{display:flex;gap:6px;flex:0 0 auto}
  .chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--muted);background:var(--surface-2);
    border:1px solid var(--hair);border-radius:999px;padding:1px 7px 1px 6px;font-variant-numeric:tabular-nums}
  .chip svg{width:11px;height:11px}
  .chip.pin{color:#fff;border:0}
  /* new, unseen-by-this-viewer media/memory: green until they open the card */
  .chip.media.unseen{color:#fff;background:var(--olive);border-color:var(--olive);box-shadow:0 0 0 3px color-mix(in srgb, var(--olive) 28%, transparent)}
  /* Tapestry view hidden for now (button removed from the toolbar) */
  #viewTapestry{display:none}

  .empty-hero{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;max-width:340px}
  .empty-hero .eh-crest{width:56px;height:56px;color:var(--brass);opacity:.8;margin-bottom:6px}
  .empty-hero h2{font-family:"GFS Didot",Georgia,serif;font-weight:400;font-size:24px;margin:.2em 0 .3em;color:var(--ink);text-wrap:balance}
  .empty-hero p{color:var(--muted);font-size:14.5px;line-height:1.5;margin:0 0 18px}

  .zoom{position:absolute;right:16px;bottom:16px;z-index:15;display:flex;flex-direction:column;gap:6px}
  body.mapview .zoom{display:none}
  .zoom .icon-btn{background:var(--surface);box-shadow:var(--shadow)}

  .status-pill{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:16;
    display:none;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--brass);color:var(--ink);
    padding:8px 14px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);max-width:92%}
  .status-pill .ic{width:15px;height:15px;color:var(--brass);flex:0 0 auto}
  body:not(.editmode) .status-pill.ro{display:flex}
  body.mapview .status-pill{display:none}

  /* Map legend + filter */
  .maptools{position:absolute;left:16px;top:16px;z-index:500;display:none;flex-direction:column;gap:10px;max-width:230px}
  body.mapview .maptools{display:flex}
  .mapcard{background:var(--surface);border:1px solid var(--hair);border-radius:11px;box-shadow:var(--shadow);padding:12px 13px}
  .mapcard h4{margin:0 0 9px;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .mapcard select{width:100%;font-family:inherit;font-size:13.5px;padding:8px 9px;border-radius:8px;border:1px solid var(--hair);background:var(--surface-2);color:var(--ink)}
  .legend{display:flex;flex-direction:column;gap:7px}
  .legend button{display:flex;align-items:center;gap:9px;background:transparent;border:0;cursor:pointer;color:var(--ink);font-family:inherit;font-size:13px;padding:2px 0;text-align:left;width:100%}
  .legend button .sw{width:12px;height:12px;border-radius:50%;flex:0 0 auto;border:2px solid var(--surface)}
  .legend button.off{opacity:.38}
  .legend button .ct{margin-left:auto;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
  #mapAddPin.armed{background:var(--accent);color:#fff;border-color:var(--accent)}
  :root[data-theme="dark"] #mapAddPin.armed,:root:not([data-theme="light"]) #mapAddPin.armed{color:#08161a}
  .kzpop .kzpop-btn{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:12.5px;font-weight:600;
    border:1px solid var(--accent);background:var(--accent);color:#fff;padding:5px 10px;border-radius:7px;cursor:pointer}
  .kzpop .kzpop-btn:hover{filter:brightness(1.06)}
  .drag-tip{font-size:12.5px;color:var(--muted);line-height:1.4;display:flex;gap:8px;align-items:flex-start}
  .drag-tip .di{width:15px;height:15px;flex:0 0 auto;color:var(--accent);margin-top:1px}
  .guard-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
  .guard-chips:empty{display:none}
  .gchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--hair);
    border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;color:var(--ink)}
  .gchip .grm{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:13px;line-height:1;padding:2px 4px;border-radius:50%}
  .gchip .grm:hover{color:var(--danger)}
  .guard-add{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}

      <path d="M12 7v7M9 10.5h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>

    <div class="titles"><div class="fam" id="famTitle"></div><div class="sub" id="subTitle"></div></div>
    <div class="spacer"></div>
    <div class="toolbar">
      <div class="save-ind" id="saveInd" title=""><span class="dot"></span><span id="saveTxt"></span></div>
      <div class="seg" role="group" aria-label="View">
        <button id="viewTree" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 4v6M6 20v-4a2 2 0 012-2h8a2 2 0 012 2v4M12 10v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><rect x="9" y="2" width="6" height="4" rx="1" stroke="currentColor" stroke-width="1.7"/></svg><span class="lbl" id="viewTreeLbl"></span></button>
        <button id="viewMap" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" stroke="currentColor" stroke-width="1.6"/></svg><span class="lbl" id="viewMapLbl"></span></button>
        <button id="viewTapestry" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 8.5h17M3.5 12h17M3.5 15.5h17M8 4.5v15M14 4.5v15" stroke="currentColor" stroke-width="1.1"/><path d="M3.2 4.5l-1.2-2M20.8 4.5l1.2-2M3.2 19.5l-1.2 2M20.8 19.5l1.2 2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><span class="lbl" id="viewTapLbl"></span></button>
      </div>
      <div class="seg" role="group" aria-label="Language" id="langSeg">
        <button id="langEl" aria-pressed="false" lang="el">ΕΛ</button>
        <button id="langEn" aria-pressed="true">EN</button>
      </div>
      <button class="btn edit-only" id="addBtn"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="lbl" id="addLbl"></span></button>
      <button class="btn" id="editBtn"><svg class="ic" viewBox="0 0 24 24" fill="none" id="editIcon"><path d="M6 10V8a6 6 0 1112 0v2" stroke="currentColor" stroke-width="1.6"/><rect x="4.5" y="10" width="15" height="10" rx="2.2" stroke="currentColor" stroke-width="1.6"/></svg><span class="lbl" id="editLbl"></span></button>
      <button class="btn icon-btn edit-only" id="undoBtn" aria-label="Undo" disabled><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M9 7L4 12l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 12h10a6 6 0 016 6v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button class="btn icon-btn edit-only" id="redoBtn" aria-label="Redo" disabled><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M15 7l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12H10a6 6 0 00-6 6v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button class="btn edit-only" id="openShare"><svg class="ic" viewBox="0 0 24 24" fill="none"><circle cx="18" cy="5" r="2.6" stroke="currentColor" stroke-width="1.6"/><circle cx="6" cy="12" r="2.6" stroke="currentColor" stroke-width="1.6"/><circle cx="18" cy="19" r="2.6" stroke="currentColor" stroke-width="1.6"/><path d="M8.3 10.9l7.4-4.3M8.3 13.1l7.4 4.3" stroke="currentColor" stroke-width="1.6"/></svg><span class="lbl" id="shareLbl2"></span></button>
      <button class="btn icon-btn edit-only" id="openSettings" aria-label="Language and display"><svg class="ic" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.6"/><path d="M12 3.2v2.2M12 18.6v2.2M4.6 7.5l1.9 1.1M17.5 15.4l1.9 1.1M19.4 7.5l-1.9 1.1M6.5 15.4l-1.9 1.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <button class="btn icon-btn" id="searchBtn" aria-label="Search"><svg class="ic" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.4-3.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button class="btn icon-btn edit-only" id="dataBtn" aria-label="Backup and export"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M12 3v10M8.5 9.5L12 13l3.5-3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 16v3a1 1 0 001 1h12a1 1 0 001-1v-3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      <button class="btn icon-btn" id="helpBtn" aria-label="Help"><svg class="ic" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M9.6 9.4c.2-1.3 1.2-2.1 2.5-2.1 1.4 0 2.4.8 2.4 2 0 1.1-.7 1.6-1.6 2.2-.8.5-1.2 1-1.2 1.9v.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg></button>
    </div>
  </header>

  <div class="stagewrap">
    <div class="viewport" id="viewport">
      <div class="status-pill ro" id="roPill"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M6 10V8a6 6 0 1112 0v2" stroke="currentColor" stroke-width="1.6"/><rect x="4.5" y="10" width="15" height="10" rx="2.2" stroke="currentColor" stroke-width="1.6"/></svg><span id="roText"></span></div>
      <div id="stage"><svg id="wires"></svg></div>
      <div class="empty-hero" id="emptyHero" hidden>
        <svg class="eh-crest" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2.5c2.2 2.4 5 3.3 7.5 3.3-.2 6.6-3 11.4-7.5 13.7C7.5 17.2 4.7 12.4 4.5 5.8 7 5.8 9.8 4.9 12 2.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
        <h2 id="ehTitle"></h2><p id="ehText"></p>
        <button class="btn primary" id="ehAdd"></button>
      </div>
      <div class="zoom">
        <button class="btn icon-btn" id="zIn" aria-label="Zoom in"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button class="btn icon-btn" id="zOut" aria-label="Zoom out"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button class="btn icon-btn" id="zFit" aria-label="Fit"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M4 9V5a1 1 0 011-1h4M20 9V5a1 1 0 00-1-1h-4M4 15v4a1 1 0 001 1h4M20 15v4a1 1 0 01-1 1h-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <div id="map"></div>

    <div id="tapestry">
      <div id="tapCanvas"></div>
      <div class="tapbar" id="tapestrytools">
        <div class="tapbrand"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l2.1 4.6L19 8.3l-3.5 3.4.9 4.9L12 14.3 7.6 16.6l.9-4.9L5 8.3l4.9-.7L12 3z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
        <div class="tapbtns">
          <button class="btn icon-btn" id="tapZIn" aria-label="Zoom in"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          <button class="btn icon-btn" id="tapZOut" aria-label="Zoom out"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          <button class="btn icon-btn" id="tapFit" aria-label="Fit"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M4 9V5a1 1 0 011-1h4M20 9V5a1 1 0 00-1-1h-4M4 15v4a1 1 0 001 1h4M20 15v4a1 1 0 01-1 1h-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
        </div>
        <div class="tapexport">
          <button class="btn" id="tapExportBtn"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M12 3v10M8.5 9.5L12 13l3.5-3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 16v3a1 1 0 001 1h12a1 1 0 001-1v-3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span class="lbl" id="tapExportLbl"></span></button>
          <div class="pop menu" id="tapExportMenu">
            <button class="menu-item" id="tapDlPng"></button>
            <button class="menu-item" id="tapDlSvg"></button>
            <button class="menu-item" id="tapDoPrint"></button>
          </div>
        </div>
      </div>
      <div class="taphint" id="tapHintWrap"><span id="tapHint"></span></div>
    </div>

    <div class="maptools">
      <div class="mapcard"><h4 id="mtPersonLbl"></h4><select id="mapPerson"></select>
        <button class="btn edit-only" id="mapAddPin" style="margin-top:8px;width:100%;justify-content:center"></button></div>
      <div class="mapcard"><h4 id="mtLegendLbl"></h4><div class="legend" id="legend"></div></div>
      <div class="mapcard drag-tip edit-only" id="dragTip"></div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="Person">
  <div class="drawer-head"><h3 id="drawerTitle"></h3>
    <button class="btn icon-btn" id="drawerClose" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot edit-only" id="drawerFoot">
    <button class="link-danger" id="delBtn"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M5 7h14M10 7V5h4v2M8 7l1 12h6l1-12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="delLbl"></span></button>
    <div class="spacer"></div>
    <button class="btn" id="moveBtn"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M12 3v18M3 12h18M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="moveLbl"></span></button>
    <button class="btn primary" id="saveBtn"></button>
  </div>
</aside>

<div class="modal" id="pcModal" role="dialog" aria-modal="true" aria-label="Edit access">
  <div class="box">
    <h2 id="pcTitle"></h2>
    <p class="lede" id="pcLede"></p>
    <div class="pc-field"><input type="password" id="pcInput" autocomplete="off" /></div>
    <div class="pc-err" id="pcErr"></div>
    <div class="row-end"><button class="btn" id="pcCancel"></button><button class="btn primary" id="pcOk"></button></div>
  </div>
</div>

<div class="modal" id="helpModal" role="dialog" aria-modal="true" aria-label="How this works">
  <div class="box">
    <button class="btn icon-btn close-x" id="helpClose" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <h2 id="helpTitle"></h2><p class="lede" id="helpLede"></p><ol id="helpSteps"></ol>
    <div class="note" id="helpNote"></div>
  </div>
</div>

<div class="modal" id="settingsModal" role="dialog" aria-modal="true" aria-label="Tree settings">
  <div class="box">
    <button class="btn icon-btn close-x" id="settingsClose" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <h2 id="setTitle"></h2><p class="lede" id="setLede"></p>
    <div class="set-opts">
      <label class="set-opt"><input type="radio" name="langmode" value="bi" id="setBi"><span class="so-txt"><b id="setBiLbl"></b><small id="setBiSub"></small></span></label>
      <label class="set-opt"><input type="radio" name="langmode" value="mono" id="setMono"><span class="so-txt"><b id="setMonoLbl"></b><small id="setMonoSub"></small></span></label>
    </div>
    <div class="field" id="setSecondWrap"><label for="setSecond" id="setSecondLbl"></label><select id="setSecond" class="sel"></select></div>
    <div class="row-end"><button class="btn" id="setCancel"></button><button class="btn primary" id="setSave"></button></div>
  </div>
</div>

<div class="modal" id="shareModal" role="dialog" aria-modal="true" aria-label="Share">
  <div class="box">
    <button class="btn icon-btn close-x" id="shareClose" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <h2 id="shareTitle"></h2><p class="lede" id="shareLede"></p>
    <div class="share-link" id="rowViewEn"><div class="sl-head"><span class="sl-lbl" id="lblViewEn"></span></div><div class="sl-row"><input id="urlViewEn" readonly /><button class="btn" data-copy="urlViewEn"></button></div></div>
    <div class="share-link" id="rowViewEl"><div class="sl-head"><span class="sl-lbl" id="lblViewEl"></span></div><div class="sl-row"><input id="urlViewEl" readonly /><button class="btn" data-copy="urlViewEl"></button></div></div>
    <div class="share-link" id="rowEditEn"><div class="sl-head"><span class="sl-lbl" id="lblEditEn"></span></div><div class="sl-row"><input id="urlEditEn" readonly /><button class="btn" data-copy="urlEditEn"></button></div></div>
    <div class="share-link" id="rowEditEl"><div class="sl-head"><span class="sl-lbl" id="lblEditEl"></span></div><div class="sl-row"><input id="urlEditEl" readonly /><button class="btn" data-copy="urlEditEl"></button></div></div>
    <style>
      #shareModal .so-check{display:flex;align-items:flex-start;gap:9px;font-size:.9rem;color:var(--muted,#5d6b6f);cursor:pointer;line-height:1.35;margin:12px 0 2px}
      #shareModal .so-check input{margin-top:2px;flex:0 0 auto}
    </style>
    <label class="so-check"><input type="checkbox" id="shProtect"><span id="shProtectLbl"></span></label>
    <div class="share-msg" id="shareMsg"></div>
    <div class="row-end"><button class="link-danger" id="shRotate"></button><div class="spacer"></div><button class="btn primary" id="shareDone"></button></div>
  </div>
</div>

<div class="pop" id="searchPop"><input id="searchInput" type="text" autocomplete="off" /><div class="pop-res" id="searchRes"></div></div>
<div class="pop menu" id="dataMenu">
  <button class="menu-item" id="dlBackup"></button>
  <button class="menu-item" id="dlGedcom"></button>
  <button class="menu-item" id="doRestore"></button>
</div>
<input type="file" id="restoreFile" accept=".json,application/json" style="display:none" />
<div class="move-hint" id="moveHint"><span id="moveHintTxt"></span><button class="btn" id="moveHintDone"></button></div>
<div class="toast" id="toast"></div>
<div id="lightbox"><img alt="" /></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin=""></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js" crossorigin=""></script>
