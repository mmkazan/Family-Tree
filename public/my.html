<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Elaia — your trees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
  /* Locked to LIGHT. Palette + fonts taken from the app (index.html). */
  :root{
    color-scheme:light;
    --bg:#e9ebe4; --surface:#f8f8f3; --surface-2:#f1f2ea;
    --ink:#17262b; --muted:#5d6b6f; --faint:#8a9599;
    --accent:#1e5c6e; --accent-deep:#17495a; --accent-soft:#dbe6e6;
    --brass:#b4894a; --olive:#6f9b6e; --line:#b7a98a; --hair:#d7d8cd; --danger:#a5453a;
    --shadow:0 1px 2px rgba(23,38,43,.08),0 6px 18px rgba(23,38,43,.09);
    --shadow-lg:0 12px 40px rgba(23,38,43,.16); --radius:11px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:600px;margin:0 auto;padding:54px 22px 80px}
  .serif{font-family:"GFS Didot",Georgia,"Times New Roman",serif;font-weight:400}
  header.top{text-align:center;margin-bottom:32px}
  .brand{display:inline-flex;align-items:center;gap:11px}
  .brand svg{width:32px;height:32px;color:var(--olive)}
  .brand .name{font-family:"GFS Didot",Georgia,serif;font-weight:400;font-size:2.4rem;letter-spacing:.5px;color:var(--ink);line-height:1}
  .tagline{color:var(--muted);margin:.55em 0 0;font-size:1.02rem}
  .card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 24px}
  h2.serif{font-size:1.55rem;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 20px;font-size:.96rem}
  label{display:block;font-size:.8rem;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 6px}
  input[type=email],input[type=text]{width:100%;border:1px solid var(--hair);background:var(--surface-2);color:var(--ink);
    border-radius:8px;padding:11px 12px;font:inherit;font-size:1rem;outline:none;transition:.15s}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .btn{border:1px solid var(--accent);border-radius:8px;padding:11px 18px;font:inherit;font-weight:600;font-size:.96rem;cursor:pointer;transition:.15s;
    background:var(--accent);color:#fff}
  .btn:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--hair)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent-deep);background:transparent}
  .btn.block{width:100%;justify-content:center;display:inline-flex;align-items:center;gap:8px}
  .msg{margin-top:14px;font-size:.92rem;color:var(--muted);min-height:1.2em}
  .msg.good{color:var(--accent-deep)} .msg.bad{color:var(--danger)}

  .acctbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
  .acctbar .who{font-size:.92rem;color:var(--muted)} .acctbar .who b{color:var(--ink);font-weight:600}
  .trees{display:flex;flex-direction:column;gap:12px;margin:0 0 20px}
  .tree{display:flex;align-items:center;justify-content:space-between;gap:12px;
    border:1px solid var(--hair);border-left:4px solid var(--olive);border-radius:10px;background:var(--surface-2);padding:15px 16px;text-decoration:none;color:inherit;transition:.15s}
  .tree:hover{border-color:var(--accent);border-left-color:var(--olive);transform:translateY(-1px);box-shadow:var(--shadow)}
  .tree .t-name{font-family:"GFS Didot",Georgia,serif;font-size:1.3rem;line-height:1.15}
  .tree .t-meta{color:var(--muted);font-size:.85rem;margin-top:1px}
  .tree .t-go{color:var(--accent-deep);font-weight:600;font-size:.9rem;white-space:nowrap}
  .empty{text-align:center;color:var(--muted);padding:22px 8px;border:1px dashed var(--line);border-radius:10px;margin-bottom:18px}
  .divider{border:none;border-top:1px solid var(--hair);margin:20px 0}
  .newtree{display:flex;gap:10px}.newtree input{flex:1}
  @media(max-width:460px){.newtree{flex-direction:column}}
  .foot{text-align:center;color:var(--faint);font-size:.8rem;margin-top:26px}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid var(--hair);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21V9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 12c-1.6-2.4-4.4-3-6.5-2.3C6 12 9 13 12 12Z" fill="currentColor" opacity=".55"/><path d="M12 9.5c1.4-2.6 4.3-3.4 6.5-2.8C17.7 9.5 14.8 10.6 12 9.5Z" fill="currentColor"/><circle cx="12" cy="20.5" r="1.3" fill="currentColor"/></svg>
      <span class="name">Elaia</span>
    </span>
    <p class="tagline">Your family trees — one root, many branches.</p>
  </header>

  <section id="view" aria-live="polite">
    <div class="card"><p class="sub" style="margin:0"><span class="spin"></span> Loading…</p></div>
  </section>

  <p class="foot">Private by design. Only you and people you share a link with can see a tree.</p>
</div>

<script>
(function(){
  "use strict";
  var view=document.getElementById("view");
  function esc(s){return (s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function api(path,opts){opts=opts||{};opts.credentials="include";return fetch(path,opts);}

  function boot(){
    api("/api/me").then(function(r){ return r.status===200?r.json():null; })
      .then(function(me){ me?showAccount(me):showSignIn(); })
      .catch(function(){ showSignIn(); });
  }

  /* ---------- signed out ---------- */
  function showSignIn(){
    view.innerHTML =
      '<div class="card">'+
      '<h2 class="serif">Sign in</h2>'+
      '<p class="sub">Enter your email and we’ll send you a one-tap sign-in link. No password to remember.</p>'+
      '<label for="em">Email</label>'+
      '<input type="email" id="em" placeholder="you@example.com" autocomplete="email">'+
      '<div style="height:14px"></div>'+
      '<button class="btn block" id="send">Send my sign-in link</button>'+
      '<div class="msg" id="m"></div>'+
      '</div>';
    var em=document.getElementById("em"), send=document.getElementById("send"), m=document.getElementById("m");
    function submit(){
      var email=(em.value||"").trim();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ m.className="msg bad"; m.textContent="That doesn’t look like an email address."; return; }
      send.disabled=true; m.className="msg"; m.innerHTML='<span class="spin"></span> Sending…';
      api("/api/auth/request",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:email})})
        .then(function(r){return r.json();})
        .then(function(){ m.className="msg good"; m.textContent="Check your email — we’ve sent a sign-in link. Open it on this device."; send.disabled=false; })
        .catch(function(){ m.className="msg bad"; m.textContent="Couldn’t send just now — try again in a moment."; send.disabled=false; });
    }
    send.addEventListener("click",submit);
    em.addEventListener("keydown",function(e){ if(e.key==="Enter")submit(); });
    em.focus();
  }

  /* ---------- signed in ---------- */
  function showAccount(me){
    view.innerHTML =
      '<div class="card">'+
      '<div class="acctbar"><span class="who">Signed in as <b>'+esc(me.email)+'</b></span>'+
      '<button class="btn ghost" id="out">Sign out</button></div>'+
      '<h2 class="serif">Your trees</h2>'+
      '<p class="sub">Open a tree to view or edit it.</p>'+
      '<div id="trees"><p class="sub"><span class="spin"></span> Loading your trees…</p></div>'+
      '<hr class="divider">'+
      '<label for="nt">Start a new tree</label>'+
      '<div class="newtree"><input type="text" id="nt" placeholder="Family name (e.g. Kazantzis)"><button class="btn" id="create">Create</button></div>'+
      '<div class="msg" id="m2"></div>'+
      '</div>';
    document.getElementById("out").addEventListener("click",function(){
      api("/api/auth/logout",{method:"POST"}).then(function(){ location.reload(); }).catch(function(){ location.reload(); });
    });
    var nt=document.getElementById("nt"), create=document.getElementById("create"), m2=document.getElementById("m2");
    function makeTree(){
      var name=(nt.value||"").trim();
      create.disabled=true; m2.className="msg"; m2.innerHTML='<span class="spin"></span> Creating…';
      var body={}; if(name) body.title={en:name, el:name};
      api("/api/trees",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)})
        .then(function(r){return r.json();})
        .then(function(j){ if(j&&j.id){ location.href="/?id="+encodeURIComponent(j.id); } else { throw new Error(); } })
        .catch(function(){ m2.className="msg bad"; m2.textContent="Couldn’t create the tree — try again."; create.disabled=false; });
    }
    create.addEventListener("click",makeTree);
    nt.addEventListener("keydown",function(e){ if(e.key==="Enter")makeTree(); });
    loadTrees();
  }

  function loadTrees(){
    api("/api/trees").then(function(r){return r.json();}).then(function(d){
      var box=document.getElementById("trees"); if(!box)return;
      var list=(d&&d.trees)||[];
      if(!list.length){ box.innerHTML='<div class="empty">No trees yet — start one below.</div>'; return; }
      box.className="trees";
      box.innerHTML=list.map(function(t){
        var title=(t.title&&(t.title.en||t.title.el))||"Untitled tree";
        var n=t.people||0;
        return '<div class="tree-row" style="display:flex;align-items:stretch;gap:8px">'+
          '<a class="tree" style="flex:1;margin:0" href="/?id='+encodeURIComponent(t.id)+'">'+
            '<span><span class="t-name">'+esc(title)+'</span><span class="t-meta">'+n+' '+(n===1?'person':'people')+'</span></span>'+
            '<span class="t-go">Open →</span></a>'+
          '<button type="button" class="t-del" data-id="'+esc(t.id)+'" data-name="'+esc(title)+'" aria-label="Delete tree" title="Delete this tree" '+
            'style="border:1px solid var(--hair);background:var(--surface-2);color:var(--muted);border-radius:10px;padding:0 14px;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap;transition:.15s">Delete</button>'+
        '</div>';
      }).join("");
      Array.prototype.forEach.call(box.querySelectorAll(".t-del"),function(btn){
        btn.addEventListener("click",function(){ deleteTree(btn.getAttribute("data-id"), btn.getAttribute("data-name")); });
      });
    }).catch(function(){
      var box=document.getElementById("trees"); if(box) box.innerHTML='<div class="empty">Couldn’t load your trees — refresh to try again.</div>';
    });
  }

  function deleteTree(id,name){
    if(!window.confirm('Permanently delete “'+(name||'this tree')+'”?\n\nThis removes the tree and all of its backups, for everyone you shared it with. It cannot be undone.')) return;
    if(!window.confirm('Last check — this is permanent. Delete “'+(name||'this tree')+'”?')) return;
    api("/api/tree-delete",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:id})})
      .then(function(r){return r.json();})
      .then(function(j){ if(j&&j.ok){ loadTrees(); } else { alert("Couldn’t delete just now — please try again."); } })
      .catch(function(){ alert("Couldn’t delete just now — please try again."); });
  }

  boot();
})();
</script>
</body>
</html>
